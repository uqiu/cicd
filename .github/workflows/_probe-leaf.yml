name: Probe leaf
on:
  workflow_call:
    inputs:
      s:
        type: string
        default: ''
      n:
        type: number
        default: 60
      b:
        type: boolean
        default: true
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: echo "s=${{ inputs.s }} n=${{ inputs.n }} b=${{ inputs.b }}"
